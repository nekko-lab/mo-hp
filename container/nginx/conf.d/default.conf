# /etc/nginx/http.d/default.conf
# Next.js サーバー(:3000)を同一コンテナ内で動かし、nginx はその前段のリバースプロキシ。
upstream nextjs {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;

  # ---------- 圧縮 ----------
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
  gzip_min_length 256;
  gzip_proxied any;

  # ---------- セキュリティヘッダー ----------
  # nginx は location 内に add_header があると server レベルの add_header を継承しないため、
  # Cache-Control を上書きする location では下記 3 つを個別に再掲している。
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---------- プロキシ共通設定 ----------
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ---------- Next.jsの静的アセット ----------
  # `^~` を付けないと下の正規表現 location に優先されてしまう。
  location ^~ /_next/static/ {
    proxy_pass http://nextjs;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    access_log off;
  }

  # ---------- 静的ファイル (public/ 配下など) ----------
  location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|woff2?|ttf|otf|eot|css|js)$ {
    proxy_pass http://nextjs;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    access_log off;
  }

  # ---------- キャッシュ削除 API (ローカルホストのみ) ----------
  location = /api/revalidate {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://nextjs;
  }

  # ---------- URL ルーティング ----------
  # ルーティングと 404 ページは Next.js 側が処理する。
  location / {
    proxy_pass http://nextjs;
  }

  # ---------- メトリクス (ローカルホストのみ) ----------
  location /metrics {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    deny all;
  }

  access_log /var/log/nginx/access.log combined_realip;
  error_log /var/log/nginx/error.log;
}
