---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mikusorigin-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-mo
  template:
    metadata:
      labels:
        app: app-mo
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9113'
        prometheus.io/path: '/metrics'
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: nginx-logs
          emptyDir: {}
      containers:
        - name: mikus-origin-container
          image: "ghcr.io/nekko-lab/mo-hp:d0a0361dba4edb5297653da2185ee7bbdc064a61" # ghcr.io/${{ github.repository }}:${{ github.sha }}
          imagePullPolicy: Always

          env:
            - name: GROWI_HOME_URL
              valueFrom:
                secretKeyRef:
                  name: growi-secret
                  key: url

            - name: GROWI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: growi-secret
                  key: token

            - name: REVALIDATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: growi-secret
                  key: revalidate-secret

          ports:
            - containerPort: 80
              name: http

          # nginxとNext.jsの起動完了を確認する。
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            limits:
              memory: '2048Mi'
              cpu: '4'
            requests:
              memory: '256Mi'
              cpu: '250m'

          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx

        - name: nginx-exporter
          image: 'nginx/nginx-prometheus-exporter:1.5.1'
          args:
            - -nginx.scrape-uri=http://localhost:80/metrics
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            limits:
              memory: '2048Mi'
              cpu: '2'
            requests:
              memory: '64Mi'
              cpu: '100m'
