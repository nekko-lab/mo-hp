---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mikusorigin-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-mo
  template:
    metadata:
      labels:
        app: app-mo
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9113'
        prometheus.io/path: '/metrics'
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: nginx-logs
          emptyDir: {}
      containers:
        - name: mikus-origin-container
          image: 'ghcr.io/nekko-lab/mikus_origin.com:4ccf520abeaceabc689109f7460ea2931f6a8222' # ghcr.io/${{ github.repository }}:${{ github.sha }}
          imagePullPolicy: Always
          # 活動実績ページは Growi から動的に取得するため、API の接続情報が必要。
          # 事前に Secret を作成しておく:
          #   kubectl create secret generic growi-secret \
          #     --from-literal=url=https://<growi-host> \
          #     --from-literal=token=<API トークン>
          #     --from-literal=token=<API トークン> \
          #     --from-literal=revalidate-secret=<ランダムな文字列>
          env:
            - name: GROWI_HOME_URL
              valueFrom:
                secretKeyRef:
                  name: growi-secret
                  key: url
            - name: GROWI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: growi-secret
                  key: token
            - name: REVALIDATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: growi-secret
                  key: revalidate-secret
          ports:
            - containerPort: 80
              name: http
          # Next.js サーバーの起動には数秒かかるため、起動完了まで振り分けない。
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: '2048Mi'
              cpu: '4'
            requests:
              memory: '256Mi'
              cpu: '250m'
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
        - name: nginx-exporter
          image: 'nginx/nginx-prometheus-exporter:1.5.1'
          args:
            - -nginx.scrape-uri=http://localhost:80/metrics
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            limits:
              memory: '2048Mi'
              cpu: '2'
            requests:
              memory: '64Mi'
              cpu: '100m'
